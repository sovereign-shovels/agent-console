[package]
name = "agent-console"
version = "0.1.0"
edition = "2021"
authors = ["Sovereign Shovels <github.com/sovereign-shovels>"]
license = "Apache-2.0"
description = "Unified log timeline for your agent sessions. Replay, search, compare."
repository = "https://github.com/sovereign-shovels/agent-console"
rust-version = "1.75"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"
dirs = "5"

[profile.release]
opt-level = 3
lto = true
strip = true
